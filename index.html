<style>
 /* The game owns the viewport. It used to sit in a 16/9 box capped at 80vh,
    which on a 1440p display left it about a third of the screen and forced the
    480x270 backbuffer through a 3-4x upscale. #wrap now fills the window and
    fit() letterboxes the canvas inside it, so the picture is as large as the
    display allows and RS can raise the backbuffer to match. */
 html,body{margin:0;padding:0;background:#0d0b1f;height:100%;overflow:hidden}
 #wrap{position:relative;width:100vw;height:100vh;margin:0;overflow:hidden;
   background:#0d0b1f;font-family:"Press Start 2P","Courier New",Courier,ui-monospace,monospace;
   outline:none;touch-action:none;display:flex;align-items:center;justify-content:center;
   user-select:none;-webkit-user-select:none}
 /* dvh tracks mobile browser chrome collapsing; ignored where unsupported, and
    the 100vh above stays as the fallback */
 @supports (height:100dvh){ #wrap{height:100dvh} }
 #wrap:fullscreen,#wrap:-webkit-full-screen{width:100vw;height:100vh}
 /* Sized by fit() to a whole (or half) multiple of 480x270. A fractional upscale
    with image-rendering:pixelated makes some source pixels 3 device px wide and
    others 4, which throws away every integer snap the renderer does. */
 #gl{display:block;image-rendering:pixelated}
 /* WebGL post-processing target. Sits directly over #gl at the same rect and is
    fully opaque, so #gl is simply covered — NOT hidden, because a hidden element
    stops receiving pointer events and all the touch zones live on #gl.
    pointer-events:none lets taps fall straight through. Its backing store is the
    DEVICE resolution, not 480x270, so bloom and scanlines are computed per
    device pixel while the source texture stays 480x270 NEAREST — crisp pixel art
    with smooth post. */
 #fx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
   display:none;z-index:1;pointer-events:none}
 #fx.on{display:block}
 #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4fd6c8;font-size:9px;background:#0d0b1f;z-index:9}
 #screen{position:absolute;inset:0;z-index:5;background:rgba(13,11,31,.74);display:flex;align-items:center;
   justify-content:center;text-align:center;color:#f4f1de;padding:14px;overflow:auto}
 #screen.hide{display:none}
 .poster{width:min(100%,520px);border:3px solid #f2a71b;display:block;margin:0 auto 12px;box-shadow:4px 4px 0 rgba(0,0,0,.6)}
 .title{font-size:22px;color:#f2a71b;text-shadow:3px 3px 0 #8a5a2b,6px 6px 0 rgba(0,0,0,.5);margin:0 0 8px;letter-spacing:2px}
 .sub{color:#4fd6c8;font-size:8px;margin-bottom:14px;line-height:2}
 .btn{font-family:inherit;cursor:pointer;background:#1e1a3c;color:#f4f1de;border:2px solid #4fd6c8;
   padding:9px 14px;font-size:9px;margin:3px;box-shadow:3px 3px 0 rgba(0,0,0,.55)}
 .btn:hover{background:#3b2f6b}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.55)}
 .btn.lock{opacity:.3;border-color:#3b2f6b;cursor:not-allowed}
 .btn.sm{font-size:7px;padding:6px 9px}
 .keys{margin-top:12px;font-size:7px;color:rgba(244,241,222,.45);line-height:2.2}
 .card h2{font-size:12px;color:#f2c879;margin:0 0 10px}
 .stats{font-size:8px;line-height:2.3;margin-bottom:12px}.stats b{color:#4fd6c8}
 .rank{font-size:18px;color:#f2a71b;text-shadow:3px 3px 0 #8a5a2b;margin-bottom:8px}
 #wrap:focus-visible{box-shadow:0 0 0 3px #4fd6c8}
</style>

/* ══ LOGICAL UNITS vs RENDER PIXELS ══
   VW/VH are LOGICAL units. Every gameplay constant, every hitbox, every HUD
   coordinate and every touch zone is authored in them, and none of that
   changes when the backbuffer gets denser.
   RS is how many backbuffer pixels go to one logical unit. draw() opens with
   setTransform(RS,0,0,RS,..) so all the drawing code below is untouched, and
   fit() picks RS to land near one device pixel per backbuffer pixel — at 480
   wide the canvas was being CSS-upscaled 3-4x on any modern display, which is
   what made it look coarse.
   The split that matters: CODE-DRAWN art (bike, obstacles, road, the 3x5 font)
   stays authored at 1 logical unit per pixel and is blitted with smoothing
   OFF, so RS=2 turns each art pixel into an exact 2x2 block — the pixel-art
   look is preserved bit-for-bit, just delivered at the display's density.
   The PHOTOGRAPHIC bands are baked at RS instead, because they have real
   source detail to recover: the land band is 587px of photograph, and at RS=1
   it bakes into a 413px tile, discarding 30% of the source columns. RS=2 bakes
   it at 826px, which is the first integer density that throws nothing away.
   That is the whole "better graphics" win.
   RS_MAX=3 caps it: past there the bands are pure upscale and only the
   code-drawn art still gains, so the fill rate stops buying anything. */
var VW=480,VH=270;
var RS=1,RS_MAX=3;
function applyRS(){
  cv.width=VW*RS;cv.height=VH*RS;
  /* assigning width/height RESETS the whole 2D context state, so the one flag
     the renderer depends on has to be restored or every blit turns blurry */
  g.imageSmoothingEnabled=false;
  /* the bands are baked at RS, so a density change invalidates them */
  if(typeof G!=='undefined'&&G&&G.st!=null)buildBands(G.st);
}

       wh:'#f4f1de',sa:'#f2c879',am:'#f2a71b',or:'#e07b21',rd:'#e2455a',g0:'#1e3d2a',g1:'#2f5233',

/* ══ SEEDED RNG ══
   Determinism is the prerequisite for replay, golden tests and reproducible bug
   reports. Every Math.random() in the simulation used to make the run
   unrepeatable. splitmix32, not mulberry32 — its own author no longer recommends
   mulberry32 because it cannot produce roughly a third of all uint32 values.
   The state is ours, so it can be serialised into a save or a replay. */
var _rs=0x9e3779b9;
function rseed(s){_rs=s>>>0;}
function rnd(){
  _rs=_rs+0x9e3779b9|0;
  var t=_rs^_rs>>>16;t=Math.imul(t,0x21f0aaad);
  t=t^t>>>15;t=Math.imul(t,0x735a2d97);
  return((t=t^t>>>15)>>>0)/4294967296;
}
/* Smoothed 1D value noise for camera shake. Unlike Math.random() per frame it
   does not strobe, its frequency is tunable, and it is reproducible. Sampled on
   a DIFFERENT SEED PER AXIS, which is what stops the two axes correlating. */
function _h(s,n){var x=Math.imul(n^s,0x9e3779b9);x^=x>>>15;x=Math.imul(x,0x21f0aaad);x^=x>>>13;return(x>>>0)/4294967296;}
function noise(seed,t){
  var i=Math.floor(t),f=t-i,a=_h(seed,i),b=_h(seed,i+1);
  f=f*f*(3-2*f);return(a+(b-a)*f)*2-1;

/* ══ MOTION AND FLASH ACCESSIBILITY ══
   Honouring the OS setting is necessary but not sufficient: plenty of players
   want shake off without disabling all system motion, so SHK is a separate user
   dial on [K]. Reduced motion zeroes shake and softens the impact flash rather
   than deleting the feedback — a hit must still read. */
/* SHAKE_PX was 7. Render is Math.round(noise*trauma^2*SHAKE_PX), and noise is
   [-1,1], so any effective amplitude below 0.5 rounded to ZERO PIXELS on every
   frame forever. At 7 the minimum trauma that moved a single pixel was
   sqrt(0.5/7)=0.267 — landings (0.13), launches (0.10) and coins (0.05) were all
   mathematically invisible. 9 plus the retuned trauma ladder gives a deliberate
   0/1/2/3px ladder instead. */
var RM=false,SHK=1,SHAKE_PX=12;
try{var _mq=matchMedia('(prefers-reduced-motion: reduce)');RM=!!_mq.matches;
  if(_mq.addEventListener)_mq.addEventListener('change',function(e){RM=!!e.matches;});
  else if(_mq.addListener)_mq.addListener(function(e){RM=!!e.matches;});
}catch(e){}
function shakeAmt(){return RM?0:SHK;}
/* WCAG 2.3.1 caps flashing at three per second and CONCURRENT flashers compound.
   This file previously ran four at once — 9Hz streak pips, 7Hz invulnerability
   blink, 3Hz clock and a full-screen red overlay. hz here is flashes per second;
   every caller now stays at or below 1.5 so two simultaneous blinkers still sit
   inside the budget. Under reduced motion the blink holds steady instead. */
/* Keyed off G.rt (wall-clock render time), NOT G.t. G.t only advances inside
   step(), which hitstop skips entirely — so during the 110ms freeze after a
   crash the blink, the shake noise and the idle tilt all held one constant
   value. A frozen world with a shaking camera is the point of hitstop; a frozen
   camera is just a hung frame. */
function blink(hz){return RM?true:((G.rt*hz*2)|0)%2===0;}

/* ══ PERSISTENCE ══
   Without this, stage unlocks, the mute choice and the shake preference all died
   on refresh, so three stages of progress evaporated on every reload. */
var SAVE='nextmile.v1',BEST=[0,0,0],_savedUnlocked=1,_savedMute=false,_savedFx=true;
function loadSave(){
  try{var o=JSON.parse(localStorage.getItem(SAVE)||'{}');
    if(o.unlocked)_savedUnlocked=Math.min(3,Math.max(1,o.unlocked|0));
    if(typeof o.shake==='number')SHK=Math.max(0,Math.min(1,o.shake));
    if(o.mute)_savedMute=true;
    if(o.fx===false)_savedFx=false;
    if(Object.prototype.toString.call(o.best)==='[object Array]')
      for(var i=0;i<3;i++)BEST[i]=o.best[i]|0;
  }catch(e){}
}
function writeSave(){
  try{localStorage.setItem(SAVE,JSON.stringify(
    {unlocked:G.unlocked,shake:SHK,mute:!AU.isOn(),best:BEST,fx:FX.enabled()}));}catch(e){}
}
loadSave();

/* ══════════════════════════════════════════════════════════════════════════
   WEBGL POST-PROCESSING
   ══════════════════════════════════════════════════════════════════════════
   Canvas 2D has no shader stage. That is a hard ceiling: no bloom, no
   chromatic aberration, no dissolve, no per-pixel colour grading — the entire
   visual vocabulary the award-winning category runs on is simply unavailable.
   Rather than port the game to a WebGL renderer (which would put every one of
   the 44 passing gameplay tests at risk for a purely visual gain), the 2D
   renderer is left completely untouched and its output is uploaded once per
   frame as a texture to a fullscreen shader pass.

   The source texture stays 480x270 with NEAREST filtering, so the pixel art is
   preserved exactly; the shader runs at DEVICE resolution, so the effects are
   smooth. Everything degrades to the raw 2D canvas if WebGL is missing or the
   shader fails to compile — the game never depends on this.

   Three effects are driven by existing simulation state rather than invented:
     - trauma  -> radial chromatic aberration + a barrel pulse. The impact FX
                  Jules specified and Canvas 2D could not deliver.
     - aiFade  -> the world desaturates while the machine is riding. This is the
                  generalisation of the desaturated-coin twins: the single best
                  idea in the file, applied to the entire frame instead of one
                  sprite. The cost of the assist becomes the look of the game.
     - flash   -> the crash tint, now additive in linear-ish space.
   ══════════════════════════════════════════════════════════════════════════ */
var FX=(function(){
  /* `st` is exposed on <html data-fx="..."> so the render path can be confirmed

  var VS='attribute vec2 p;varying vec2 uv;'+
         'void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
  var FS=[
   /* The aberration offsets are ~0.001 in uv space; mediump (10-bit mantissa on
      many mobile GPUs) quantises that to visible steps. Ask for highp and fall
      back only where the hardware genuinely lacks it. */
   '#ifdef GL_FRAGMENT_PRECISION_HIGH',
   'precision highp float;',
   '#else',
   'precision mediump float;',
   '#endif',
   'varying vec2 uv;',
   'uniform sampler2D tx;',
   'uniform vec2 px;',      /* 1 / source resolution */
   'uniform float tr;',     /* trauma 0..1   */
   'uniform float fl;',     /* flash 0..1    */
   'uniform float as;',     /* assist 0..1   */

var ROAD_Y=196, GROUND=234;

var BG_RATE=1.00;

/* ── authored segments (the fix for validated-random) ── */
var SEG=[
 {id:'open',    len:560,obs:[],  sign:[[220,'SPACE'],[300,'TO JUMP']], coin:[[380,1],[420,1],[460,1]]},

 {id:'arc',     len:620,cp:1,obs:[[280,'cone']],     coin:[[340,1],[380,2],[420,3],[460,2],[500,1]]},

/* ══════════════════════════════════════════════════════════════════════════
   PIXEL-ART TOOLKIT
   ══════════════════════════════════════════════════════════════════════════
   The frame previously held four unreconciled visual languages: nine
   photographic parallax bands, a downscaled photographic bike, a 3x5 bitmap
   font and flat fillRect sprites. The bike was the worst of it — a 344x163
   photo crushed to 103px wide with smoothing on, so against a bright sky it
   read as an unidentifiable dark blob with no silhouette.

   Everything drawn in code now goes through one pipeline: build on a
   transparent canvas, then stamp a 1px dark outline around the alpha edge.
   That single step is what makes a sprite readable over ANY background, which
   is the actual problem — a sunset stage and a night stage cannot share a
   palette-matched sprite, but they can share an outlined one.

   All of it is baked ONCE at load into cached bitmaps, so the per-frame cost
   drops from ~75 fillRect calls for five obstacles to five drawImage blits.
   ══════════════════════════════════════════════════════════════════════════ */
function disc(t,cx,cy,r,col){
  t.fillStyle=col;

/* (flat `ring()` removed — superseded by the matcap-shaded ringM()) */
function lineT(t,x0,y0,x1,y1,w,col){
  t.fillStyle=col;
  var dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy))||1,h=w>>1;
  for(var i=0;i<=n;i++)

function cvs(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
/* Fill interior gaps the primitives leave between parts. Flood the transparent
   region inward from the border; any transparent pixel the flood cannot reach
   is enclosed, and gets `col` so it reads as shadow between two components
   rather than as a window. Without this the scene shows through pinholes in the
   middle of the sprite — worst against the stage-3 sunset, where a 1px gap is a
   bright dot on a dark motorcycle.
   BODY ONLY. The wheels are legitimately see-through between the spokes, and
   running this on them would fill the rim back into a solid alloy disc — the
   exact regression the draw-order note in buildWheel() already warns about. */
function plugHoles(c,col){
  var w=c.width,h=c.height,t=c.getContext('2d'),d;
  try{d=t.getImageData(0,0,w,h);}catch(e){return;}

  for(y=0;y<h;y++){st.push(0,y);st.push(w-1,y);}
  while(st.length){
    y=st.pop();x=st.pop();
    if(x<0||y<0||x>=w||y>=h)continue;
    k=y*w+x;
    if(seen[k]||a[k*4+3]>8)continue;
    seen[k]=1;
    st.push(x+1,y);st.push(x-1,y);st.push(x,y+1);st.push(x,y-1);
  }
  t.fillStyle=col;
  for(y=0;y<h;y++)for(x=0;x<w;x++){k=y*w+x;if(!seen[k]&&a[k*4+3]<=8)t.fillRect(x,y,1,1);}

/* 4-neighbour alpha outline. Edge pixels are collected BEFORE any are written,
   or the outline cascades outward on itself. One-time cost at load. */
function outline(c,col){
  var w=c.width,h=c.height,t=c.getContext('2d'),d;
  try{d=t.getImageData(0,0,w,h);}catch(e){return;}
  if(!d||!d.data)return;
  var a=d.data,out=[],x,y,i;

    i=(y*w+x)*4;

       (y>0&&a[i-w*4+3]>8)||(y<h-1&&a[i+w*4+3]>8))out.push(x,y);

  for(i=0;i<out.length;i+=2)t.fillRect(out[i],out[i+1],1,1);

/* ══════════════════════════════════════════════════════════════════════════
   MATCAP SHADING
   ══════════════════════════════════════════════════════════════════════════
   Borrowed from the technique Bruno Simon's Awwwards Site-of-the-Year build
   used: no lights, no shadows anywhere in the scene — every surface is a single
   texture lookup indexed by the view-space normal. It is why chrome reads as
   chrome for the cost of one sample.

   Three.js is the wrong vehicle for it here (a 3D scene graph driving a 2D
   side-scroller, unavailable offline, and it would end double-click-to-run), so
   this is the technique without the dependency: generate the matcap spheres
   procedurally, assign every drawn pixel an analytic normal from the primitive
   it belongs to, and look the colour up. Baked once at load, so the per-frame
   cost is still a single blit.

   A matcap is indexed by (n.x, n.y); n.z is implied because the sphere is unit.
   Stored as a flat RGB array rather than ImageData so sampling is a plain
   array read with no canvas round-trip.
   ══════════════════════════════════════════════════════════════════════════ */
function mkMatcap(fn){
  var S=48,d=new Array(S*S*3),x,y,i=0;
  for(y=0;y<S;y++)for(x=0;x<S;x++){
    var nx=(x/(S-1))*2-1,ny=1-(y/(S-1))*2,r2=nx*nx+ny*ny;
    /* Outside the unit disc used to write pure BLACK, and mcAt() truncates its
       index — so every normal with |n|~=1 sampled a black texel instead of the
       rim colour. cylM starts at u=-r exactly, so EVERY cylinder got a
       full-length black seam along one edge; sphM hit it at all four axis
       extremes; ringM at both radii. Measured: 71 black pixels on the bike body
       and 32 on every wheel frame, concentrated on the chrome. The megaphone
       exhaust — the silhouette line of the whole sprite — carried a 12px black
       crack along its top. Clamping the normal to the rim instead of blacking it
       is one line and fixes all of it. */
    var L=Math.sqrt(r2);
    var c=r2>1?fn(nx/L,ny/L,0):fn(nx,ny,Math.sqrt(1-r2));
    d[i++]=c[0]|0;d[i++]=c[1]|0;d[i++]=c[2]|0;
  }
  return {s:S,d:d};
}
function mcAt(m,nx,ny){
  var S=m.s;
  var x=(nx*0.5+0.5)*(S-1),y=(0.5-ny*0.5)*(S-1);
  x=x<0?0:x>S-1?S-1:x; y=y<0?0:y>S-1?S-1:y;

function mix3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
/* Key light high and slightly behind-left, matching where the sun sits in the
   stage art, so the bike is lit consistently with the world it rides through. */
var LX=-0.42,LY=0.74,LZ=0.52;
function lam(nx,ny,nz){var v=nx*LX+ny*LY+nz*LZ;return v<0?0:v;}
function spec(nx,ny,nz,p){
  var hx=LX,hy=LY,hz=LZ+1,l=Math.sqrt(hx*hx+hy*hy+hz*hz);
  var v=(nx*hx+ny*hy+nz*hz)/l;return v<0?0:Math.pow(v,p);

var MC={};
function buildMatcaps(){
  /* CHROME — the whole look is the horizon: bright sky above, warm ground
     below, a hard dark band where they meet. That split is what the eye reads
     as polished metal, far more than any highlight. */
  MC.chrome=mkMatcap(function(nx,ny,nz){
    /* A WIDE, DARK horizon band is what sells chrome at this size. The first
       pass used a narrow one and the megaphone came out a uniform pale tube. */
    var sky=[198,216,244],grd=[104,78,56],hz=[16,16,22];
    var c=ny>0?mix3(hz,sky,Math.min(1,Math.max(0,(ny-0.14)*3.0)))

    return mix3(c,[236,244,255],Math.pow(1-nz,3)*0.30);      /* rim */
  });

  MC.paint=mkMatcap(function(nx,ny,nz){
    var c=mix3([150,156,172],[250,251,255],lam(nx,ny,nz));
    c=mix3(c,[255,255,255],spec(nx,ny,nz,22)*0.9);

  MC.black=mkMatcap(function(nx,ny,nz){
    var c=mix3([12,11,16],[52,50,64],lam(nx,ny,nz)*0.7);

/* ── matcap-shaded primitives ──────────────────────────────────────────────
   Each writes 1px at a time with an analytic normal. Thousands of writes, but
   every one of them happens once, at load, into a cached bitmap. */
function cylM(t,m,x0,y0,x1,y1,r){
  var dx=x1-x0,dy=y1-y0,L=Math.sqrt(dx*dx+dy*dy)||1,n=Math.ceil(L);
  var px=-dy/L,py=dx/L;                       /* perpendicular to the axis */
  for(var i=0;i<=n;i++){
    var cx=x0+dx*i/n,cy=y0+dy*i/n;
    for(var u=-r;u<=r;u+=0.5){
      var s=u/r,nz=Math.sqrt(Math.max(0,1-s*s));
      t.fillStyle=mcAt(m,px*s,-py*s);         /* screen y is down; normal y up */
      t.fillRect(Math.round(cx+px*u),Math.round(cy+py*u),1,1);
    }
  }
}
function sphM(t,m,cx,cy,r){
  for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++){
    if((x*x+y*y)>r*r)continue;
    t.fillStyle=mcAt(m,x/r,-y/r);
    t.fillRect(cx+x,cy+y,1,1);
  }
}
/* A slightly barrelled panel — the tank side. cu is how much it rolls away at
   the top and bottom edges. */
function panM(t,m,x,y,w,h,cu){
  for(var j=0;j<h;j++){
    /* v: -1 at the top row, +1 at the bottom. Screen y runs down, so the top of
       the panel faces up and its normal.y is positive. */
    var v=h>1?(j/(h-1))*2-1:0,ny=-v*cu;
    for(var i=0;i<w;i++){
      var u=w>1?(i/(w-1))*2-1:0;
      t.fillStyle=mcAt(m,u*cu*0.35,ny);
      t.fillRect(x+i,y+j,1,1);
    }

/* Torus cross-section, for tyres, rims and brake discs: the normal rolls from
   pointing inward at the inner edge to outward at the outer edge. */
function ringM(t,m,cx,cy,ro,ri){
  var mid=(ro+ri)/2,hw=(ro-ri)/2||1;
  for(var y=-ro;y<=ro;y++)for(var x=-ro;x<=ro;x++){
    var d=Math.sqrt(x*x+y*y);
    if(d>ro||d<ri)continue;
    var s=(d-mid)/hw,ux=d?x/d:0,uy=d?y/d:0;
    t.fillStyle=mcAt(m,ux*s,-uy*s);
    t.fillRect(cx+x,cy+y,1,1);
  }
}

/* ── obstacle art, reimagined ── */
function obstacle(c,kind,a,b){
  var ob=OBS[kind]||OBS.cone,w=ob.w,h=ob.cl,cx=a+(w>>1),i;

    c.fillStyle=P.gy;c.fillRect(a,b-7,w,7);                       /* footing   */
    c.fillStyle='#7b76a0';c.fillRect(a,b-7,w,2);
    c.fillStyle='#1b1628';c.fillRect(a,b-2,w,2);

function buildWheel(rot){
  /* +3 not +1: the tyre spans the full radius, so the canvas needs a 1px margin
     on every side or outline() has nowhere to put the silhouette. */
  var R=WHEEL_R,S=R*2+3,c=cvs(S,S),t=c.getContext('2d'),m=R+1,i,a;

     rot*1.4, so the three parts of one rigid wheel rotated at three different
     speeds — and neither 0.6 nor 1.4 is periodic over the 6-frame cycle, so both
     snapped backwards once per wrap, ~9 times a second at cruise. */
  ringM(t,MC.black,m,m,R,R-4);                     /* tyre         */
  for(i=0;i<14;i++){                               /* tread blocks */
    a=rot+i*Math.PI/7;
    t.fillStyle='#0f0e14';
    t.fillRect(Math.round(m+Math.cos(a)*(R-1))-1,Math.round(m+Math.sin(a)*(R-1))-1,2,2);
  }
  ringM(t,MC.chrome,m,m,R-4,R-6);                  /* rim          */
  /* Disc BEFORE spokes. It covers radii 2..5 and the spokes run 3..5.5, so
     drawing it second erased 50 of the 70 spoke pixels and the "spoked wheel"
     rendered as a solid alloy disc. Disc also shrunk so the spokes have room. */

  for(i=0;i<6;i++){                                /* drilled holes*/
    a=rot+i*Math.PI/3;

    t.fillRect(Math.round(m+Math.cos(a)*2.8),Math.round(m+Math.sin(a)*2.8),1,1);

    a=rot+i*Math.PI/5;

                     m+Math.cos(a)*(R-4.2),m+Math.sin(a)*(R-4.2),0.5);
  }
  sphM(t,MC.chrome,m,m,2);                         /* hub          */
  return c;
}
function buildBody(){

  cylM(t,MC.chrome,18,25, 21,14  , 1.8);                 /* twin shock   */
  /* frame: the GT's black cradle */
  cylM(t,MC.black ,11,14, 25,12.5, 1.5);                 /* seat rail    */
  cylM(t,MC.black ,25,12.5,41,12 , 1.5);                 /* top tube     */
  /* Steering head. Structurally it is what the top tube and downtube actually
     meet at, and it also closes a 4px see-through notch between the tank nose

     at 3x that notch was a dozen pixels of Goa sunset shining out of the middle
     of the motorcycle. */

  cylM(t,MC.black ,41,12.5,37,25 , 1.6);                 /* downtube     */
  cylM(t,MC.black ,37,25, 29,28  , 1.5);                 /* cradle       */
  /* parallel-twin engine: alloy cases, black finned barrels */

  panM(t,MC.black ,30,17, 9,8, 0.55);                    /* barrels      */
  for(i=0;i<4;i++){t.fillStyle='#6e6a88';t.fillRect(30,18+i*2,9,1);}  /* fins */
  panM(t,MC.alu   ,30,15, 9,2, 0.5);                     /* head         */
  /* upswept chrome megaphone — the silhouette line of the reference */

  cylM(t,MC.chrome,27,30, 17,29  , 1.8);                 /* mid pipe     */
  cylM(t,MC.chrome,17,29,  7,27  , 2.5);                 /* megaphone    */

     FULL tank height at every column, so the crown highlight runs unbroken
     across the taper — three stacked panM strips would each restart their own
     gradient and band the tank into thirds.

  cylM(t,MC.black ,52,16, 53,21 , 0.6);                  /* fender stay  */
  /* The whole leg is LIGHT. Black slider on a black tyre is correct for a GT650

  cylM(t,MC.alu   ,50.4,17, 51,26 , 2.0);                /* slider       */

  disc(t,57,12,2,'#f6d98a');                             /* lens         */

  t.fillStyle=P.wh;t.fillRect(55,10,2,2);                /* lens glint   */

  sphM(t,MC.paint ,38,4  ,4);
  t.fillStyle='#10161f';t.fillRect(40,3,3,3);            /* visor        */
  t.fillStyle='#7fb6e2';t.fillRect(40,3,2,1);            /* visor glint  */
  t.fillStyle='#ffffff';t.fillRect(36,1,3,1);            /* crown glint  */

     which can seal a channel that was open to the border and create an enclosed
     pixel that a pre-outline pass never saw — measured: plugging first left one
     survivor at (56,7), by the mirror stalk. Plugging second is a superset, and
     since both write P.n0 the fill is seamless with the outline. */
  outline(c,P.n0);

   The old lerp was `(tgt-G.spd)*Math.min(1,dt*2.4)`: tau=417ms, 90% of a throttle
   change taking 960ms, and an initial acceleration of 130px/s^2 — one sixth of
   gravity, on a motorcycle. That was the mushiness. `1-exp(-k*dt)` is also

   more road you see — which is also a fairness mechanism), asymmetric vertical
   lerp (slow up, quicker down) and platform-snapping on landing.
   step() MUST NEVER READ THIS. It is applied as one translate around the whole
   world block, so the bike, its shadow, the particles and the world all shift
   together and every relative position is preserved exactly — collision keeps

/* ── spawning from authored segments ── */
function feed(){
  var ord=ORDER[G.st],att=G.mode==='attract';
  while(G.segEnd < G.x+700){
    /* A real run has a finite authored ORDER. Stop at the end of it instead of
       repeating the last segment forever (which used to inflate G.endX). */
    if(!att&&G.segI>=ord.length)break;
    var base=G.segEnd,idx=G.segI,s=SEGBY[att?ord[idx%ord.length]:ord[idx]];
    G.segI++;
    s.obs.forEach(function(o){G.ents.push({t:'o',x:base+o[0],k:o[1]});});
    /* Signage was gated to `G.st===0`, but `wallrun` lives only in stage 3 and
       the wall is physically unclearable without the brake-charge. A player
       resuming with stage 3 unlocked got two impossible walls and no instruction
       at all. Signs now show wherever they are authored. */
    if(s.sign)s.sign.forEach(function(v){G.ents.push({t:'s',x:base+v[0],w:v[1]});});
    s.coin.forEach(function(c){G.ents.push({t:'c',x:base+c[0],h:c[1],f:0});});
    if(G.segI%2===1){
      /* The battery was placed at a blind base+len*0.6, which dropped it inside
         an obstacle hitbox in four of the five segments that carry one — and
         collecting needs G.y>-26 while clearing needs G.y<=-24, so the finale's
         battery had a 2px simultaneous window. The resource that gates the
         assist, i.e. the game's entire thesis, was positioned by accident.
         Now: scan the segment and take the widest gap. Deterministic. */
      var best=s.len*0.5,bd=-1;
      for(var bq=60;bq<s.len-60;bq+=20){
        var md=1e9;
        for(var bo=0;bo<s.obs.length;bo++)md=Math.min(md,Math.abs(s.obs[bo][0]-bq));
        if(md>bd){bd=md;best=bq;}
      }
      G.ents.push({t:'b',x:base+best});
    }
    G.segEnd=base+s.len;
    /* Checkpoints carry the exact generation state needed to rebuild the world
       identically. World gen is a pure function of (segI, segEnd).
       Placement was `G.segI%3===0` — a blind modulus that put every checkpoint
       immediately before the hardest segment in the stage. CPSET fires one only
       when the NEXT segment is a rest piece, so a retry always starts winnable. */
    if(CPSET[G.st][G.segI]&&G.segI<ord.length)G.ents.push({t:'k',x:base+s.len-60,
      snap:{x:base+s.len-60,segI:G.segI,segEnd:G.segEnd,coins:0,endX:G.endX}});
  }
}

/* ── update ── */
var BX=96;
function step(dt){
  if((G.mode!=='play'&&G.mode!=='attract')||G.pause)return;
  var S=ST[G.st];G.t+=dt;
  G.px=G.x;G.py=G.y;                 /* previous step, for render interpolation */
  var att=G.mode==='attract';

  /* ══ THE CLOCK IS THE FAIL STATE ══
     Run out and the stage is over. Everything that used to be free now costs
     time: the assist is slow, crashes stun you, the wheelie doubles the penalty. */
  if(!att){
    G.clock-=dt;
    if(G.clock<=8&&G.clock>0){var tk=Math.ceil(G.clock);if(tk!==G.lastTick){G.lastTick=tk;AU.tick();}}
    if(G.clock<=0){G.clock=0;fail('OUT OF TIME');return;}
  }

  /* The assist is available only while there is battery for it. Battery is now
     fuel for the AI, not a second health bar — it cannot end your run. */
  var want=att?true:(IN.ai&&G.bat>0)?1:0;
  if(want!==G.aPrev){
    if(!want&&G.mRunV>0)toast(G.mRunV+' LOST TO AI',1.6);
    if(!want){G.mRun=0;G.mRunV=0;}
    G.aPrev=want;
  }
  G.assist=want;if(want)G.aTime+=dt;

  /* WHEELIE: throttle on the ground builds it. Doubles waypoint value, cuts jump
     height enough to lock you out of tier-3 coins, and doubles the time a crash costs. */
  if(!att&&IN.th&&G.ground)WHEEL=Math.min(1,WHEEL+dt*1.7); else WHEEL=Math.max(0,WHEEL-dt*3.2);
  var tgt=want?SPD_AI:(IN.th?SPD_TH:(IN.bk?SPD_BK:SPD_COAST));
  var kk=IN.bk?K_BRAKE:(tgt>G.spd?K_UP:K_DOWN);
  G.spd+=(tgt-G.spd)*(1-Math.exp(-kk*dt));
  G.x+=G.spd*dt;

  if(!att)G.bat=Math.max(0,G.bat-(S.drain+(want?5.5:0))*dt);

  /* JQ is latched at OS-event time (keydown / pointerdown), not sampled. Two
     independent ways a press was silently dropped before:
       1. keydown and keyup both landing between two sample() calls — 16.7ms at
          60Hz, and far longer on any hitched frame, i.e. exactly the frames a
          player is mashing on.
       2. frames that execute ZERO substeps. At dt=1/144 the accumulator yields
          0,1,1,1,1,1 substeps, so every sixth frame created and destroyed the
          rising edge without step() ever seeing it. 60Hz is exactly 2x STEP,
          which is why this hid in testing.
     pressed() is kept in the OR so the headless harness, which drives IN
     directly and never calls sample(), still works. Setting IN.jp stops one
     press re-arming the buffer on all 24 substeps of the same frame. */
  if(JQ||pressed()){JBUF=BUF_T;JQ=0;IN.jp=1;}
  if(JBUF>0)JBUF-=dt;
  if(G.ground)COY=COY_T; else if(COY>0)COY-=dt;

  if(!att&&JBUF>0&&COY>0){
    /* The charge gate was 0.25 with a 0.30 multiplier, which meant the meter
       turned cyan, printed "CHARGE", played the boost and fired the sparks at a
       charge that produced v=344, peak 77.9px, and an above-72 window of just
       16.9px at brake speed against a 30px hazard band. The HUD said ready and
       the player hit the wall anyway. 0.45/0.45 gives peak 97.4px and a 274ms
       window at the gate, rising to 613ms at full. */
    var cb=G.charge>0.45?1+G.charge*0.45:1;
    /* The wheelie penalty was a step function on a continuously-building meter —
       30% of your jump vanished at an invisible boundary. Ramped over
       0.22..0.35 so the feel is continuous. The design invariant survives:
       tier 3 needs wf>=0.87 (apex 57px) and the ramp is already below that by
       the time the x2 payout switches on at 0.35. */
    var wf=1-(1-WHEEL_JUMP)*Math.min(1,Math.max(0,(WHEEL-0.22)/0.13));
    G.vy=JUMP_V*wf*cb;
    G.jt=0;G.sqImp=7.0;
    if(cb>1){AU.boost();trauma(0.30);rumble(70,0.30,0.55);
      for(var i=0;i<8;i++)spark(G.x+BX-8,GROUND-4,-30-rnd()*70,10+rnd()*40,0.35,P.cy);
      G.charge=0;}
    else AU.jump();
    G.ground=false;JBUF=0;COY=0;JHELD=true;
  }
  /* Uncuttable rise window. IN.j is frame-sampled, so the release-cut could not
     fire until the next rAF — which made the MINIMUM jump height depend on the
     player's display: ~15px at 60Hz but ~12.6px at 144Hz, on a game where a cone
     needs 20px. Gating on elapsed air time puts the floor at 22.2px everywhere. */
  if(JHELD&&!IN.j&&G.vy<0&&G.jt>=JUMP_MIN_T){G.vy*=JUMP_CUT;JHELD=false;}
  if(G.vy>0)JHELD=false;
  /* Apex gravity — Celeste's third forgiveness rule, and the one thing missing
     from an otherwise complete set. The arc had a single curvature and never
     hung, so nothing marked the top and the player had no readable window to aim
     the landing. Halving gravity near vy=0 buys 0.201s of hang versus 0.111s.
     Apex only rises 67.4 -> 68.3px, so a wall (72px) still cannot be cleared
     without the brake-charge and riseT() stays valid for every obstacle. */
  var gm;
  if(!G.ground&&IN.dn)gm=2.15;                      /* fast-fall */
  else if(!G.ground&&Math.abs(G.vy)<42)gm=0.55;     /* apex hang */
  else if(!G.ground&&G.vy>0)gm=1.28;                /* snappier descent */
  else gm=1;
  G.vy+=GRAV*gm*dt;G.y+=G.vy*dt;
  if(!G.ground)G.jt+=dt;
  if(G.y>0){
    var iv=G.vy;                                    /* capture BEFORE zeroing */
    G.y=0;G.vy=0;
    if(!G.ground){G.ground=true;G.jt=0;
      /* Trauma scaled by impact speed. Every landing from a 10px hop to a 114px
         slam previously shook identically at 0.13 — the exact failure the trauma
         model exists to prevent — and 0.13 rendered to zero pixels anyway. */
      trauma(Math.min(0.50,0.26+iv*0.00042));
      CAM.snap=CAM_SNAP;G.sqImp=-Math.min(16,iv*0.030);
      /* Hitstop on hard landings only, so a hop never stutters. A full jump
         (iv=320) and a charged one (416) get nothing; only a deliberate slam
         pays. Hitstop has to stay rare or it stops meaning "impact". */
      if(iv>430){G.hitstop=Math.min(0.05,0.012+(iv-430)*0.00006);rumble(50,0.25,0.20);}
      AU.land();
      for(var i=0;i<5;i++)spark(G.x+BX-10,GROUND,-40-rnd()*60,-20-rnd()*40,0.4,P.wh);}
  }
  else G.ground=false;

  /* brake-charge: holding brake on the ground banks a launch. Rate raised 1.4 ->
     2.2 so reaching the new 0.45 gate still takes about 0.2s. */
  if(!att&&IN.bk&&G.ground)G.charge=Math.min(1,G.charge+dt*2.2);
  if(!IN.bk&&G.ground&&G.charge>0)G.charge=Math.max(0,G.charge-dt*0.8);

  /* ══ THE ASSIST NO LONGER MAKES YOU IMMORTAL ══
     It avoids obstacles by jumping, with the trigger derived from actual speed and
     clearance instead of a fixed pixel window. If it mistimes, you crash like anyone. */
  if(want&&G.ground){
    var near=null,nd=1e9;
    for(var i=0;i<G.ents.length;i++){var e=G.ents[i];
      if(e.t!=='o')continue;
      var d=e.x-G.x-BX;
      if(d>0&&d<nd){nd=d;near=e;}}
    if(near){
      var ot=(OBS[near.k]||OBS.cone).t1;
      /* jump as late as the obstacle's own clearance allows, +6px of slack */
      /* Two bugs lived on this line. (1) COY was left at COY_T, so for 80ms
         after an AI-initiated launch a player tap could satisfy JBUF>0&&COY>0
         and OVERWRITE vy=-360 with JUMP_V=-320, dropping apex from 85.3 to
         67.4 — below the wall's 72px clearance — flying you into the very wall
         the assist had jumped for. (2) -360 out-jumped the player's -320
         outright, so holding E cleared walls the player physically cannot,
         trivialising the segment the brake-charge exists to teach and gutting
         stage 3's RIDE IT YOURSELF goal. 339 clears 72 by 3.6px: a visibly
         sketchy arc, not a free pass. */
      if(ot!==null&&nd<=21+G.spd*ot){
        G.vy=-AI_JUMP_V;G.ground=false;JHELD=false;COY=0;JBUF=0;G.jt=0;AU.jump();}
    }
  }
  if(G.inv>0)G.inv-=dt;
  feed();

  for(var i=G.ents.length-1;i>=0;i--){
    var e=G.ents[i],sx=e.x-G.x;
    if(sx<-60){G.ents.splice(i,1);continue;}
    if(sx>VW+40)continue;
    if(e.t==='c'){
      e.f=(e.f+dt*9)%4;
      var cy=coinY(e.h);
      /* !e.gone: the crash pushback at G.x-=7 is the one place G.x moves
         BACKWARDS, so a coin already flagged missed could be shoved back inside
         the hitbox and collected for points after it had already broken the
         streak. Unreachable on today's level data; one guard closes the class. */
      if(!e.gone&&Math.abs(sx-BX)<COIN_RX&&Math.abs((GROUND+G.y-24)-cy)<COIN_RY){
        G.ents.splice(i,1);
        if(want){if(!att)aiMiss(sx,cy,e.h);}
        else{G.streak++;G.mult=Math.min(5,1+Math.floor(G.streak/4));
          var val=coinVal(e.h);
          /* No trauma on a coin. It already has a pitch-stepped tone and a
             floating number, it fires 3-5 times a second, and at 0.05 it
             rendered to zero pixels regardless. Nijman's rule: don't shake on
             everything, or the shake stops meaning anything. */
          G.coins+=val;AU.coin(G.mult);
          if(G.mult>G.bestMult)G.bestMult=G.mult;
          spark(G.x+sx,cy,0,-34,0.7,P.sa,'+'+val);buzz(8);}
      }
      /* ══ A STREAK THAT CAN ACTUALLY BREAK ══
         A coin that gets past the bike uncollected ends the run of them. Before this
         the "streak" only reset on a crash, so x5 carried no risk at all. */
      /* Any coin that gets past the bike. Under assist that is a LOSS with full
         feedback: the assist only leaves the ground for obstacles, so tier 2 and 3
         coins used to slide by in total silence and never reach LOST TO AI. */
      else if(sx<BX-COIN_RX&&!e.gone){e.gone=1;
        if(want){if(!att)aiMiss(sx,cy,e.h);} else if(G.streak>0)breakStreak();}
    }else if(e.t==='b'){
      /* !att on all three: the clock, wheelie, jump, charge and collision
         branches were gated but these were not, and attract forces want=true.
         So the title screen ran ~30 AU.miss() tones, 4 checkpoint chimes and 4
         battery pickups per 4200px loop, behind a static menu, forever — silent
         only until the player's first gesture unlocked the AudioContext. */
      if(!att&&Math.abs(sx-BX)<16&&G.y>-26){G.ents.splice(i,1);G.bat=Math.min(100,G.bat+24);AU.batt();toast('+24% AI FUEL',1.1);}
    }else if(e.t==='k'){
      if(!att&&sx<BX&&!e.hit){e.hit=1;
        /* copy, don't alias: G.cp pointed straight into a transient entity and
           then mutated it in place */
        if(e.snap)G.cp={x:e.snap.x,segI:e.snap.segI,segEnd:e.snap.segEnd,
                        endX:e.snap.endX,coins:G.coins};
        AU.cp();toast('CHECKPOINT',1.3);}
    }else if(e.t==='o'){
      var cl=(OBS[e.k]||OBS.cone).cl;
      if(!att&&G.inv<=0&&Math.abs(sx-BX)<15&&G.y>-cl){
        /* crashes cost TIME now, scaled by stage hazard and doubled on a wheelie */
        var pen=(WHEEL>0.35?2.8:1.6)*S.haz;
        G.clock=Math.max(0,G.clock-pen);
        var wx=G.x+sx;
        G.inv=1.3;WHEEL=0;G.charge=0;buzz(70);trauma(0.62);G.spd*=0.4;G.flash=0.4;
        rumble(140,0.75,0.35);G.sqImp=-19;
        /* Positional rejection. G.x was untouched, so the obstacle slid straight
           THROUGH the sprite during 1.3s of invulnerability and the crash read
           as a debuff rather than a collision. px moves with it or the
           interpolation snaps for one frame. */
        G.x-=7;G.px-=7;
        if(G.streak>0)breakStreak();
        for(var q=0;q<12;q++)spark(wx,GROUND-12,-60-rnd()*120,-60-rnd()*90,0.6,P.rd);
        spark(wx+10,GROUND-58,0,-30,0.9,P.rd,'-'+pen.toFixed(1));
        AU.crash();G.crashes++;G.hitstop=0.11;
      }
    }
  }
  /* G.px must reset with G.x or draw() interpolates VIEWX from 4200 down to 0
     for exactly one frame — a visible flicker on the title screen every ~34s. */
  if(att&&G.x>=4200){G.x=0;G.px=0;G.ents=[];G.segEnd=0;G.segI=0;}
  if(!att&&G.x>=G.endX&&G.endX>0){done();return;}
  /* Decay stays INSIDE step() while the sim runs, so it is sim-rate and
     deterministic and any harness driving step() directly still sees it.
     loop() drains it separately only when step() is frozen — see there. */
  visualDecay(dt,1);
}
/* ══ VISUAL DECAY LIVES OUTSIDE step() ══
   Shake, flash, toast, streak-pip flash and particle integration all used to
   decay inside step(), which returns early for 'fail', 'done' and paused. But
   draw() only early-returns for 'attract', and the shake noise is keyed to G.rt
   which loop() advances unconditionally — so dying with residual trauma left the
   RUN OVER card jittering +/-3px under a permanent red tint, with 13 crash
   particles frozen mid-air and the last toast stuck on screen, FOREVER. Now
   frame-rate driven and mode-independent; `k` slows it during hitstop so the
   impact frame reads as time dilation rather than a hung process. */
function visualDecay(dt,k){
  var d=dt*k;
  if(G.pipT>0)G.pipT=Math.max(0,G.pipT-d);
  if(G.shake>0)G.shake=Math.max(0,G.shake-d*1.4);   /* trauma decays LINEARLY */
  if(G.flash>0)G.flash=Math.max(0,G.flash-d*1.8);
  if(G.toastT>0)G.toastT-=d;
  for(var i=G.fx.length-1;i>=0;i--){var f=G.fx[i];f.l-=d;
    if(f.l<=0){G.fx.splice(i,1);if(FXP.length<256)FXP.push(f);continue;}
    /* Score numbers rose at a dead-constant 34px/s for 0.7s — the most linear
       motion on screen, on the element that teaches the scoring model. */
    f.x+=f.vx*d;f.y+=f.vy*d;
    if(!f.txt)f.vy+=260*d; else f.vy*=Math.max(0,1-d*3.4);}
}
function breakStreak(){
  G.streak=0;G.mult=1;G.pipT=0.5;AU.brk();
}
/* The thesis of the whole campaign, in one function: what the machine costs you.
   Reports the VALUE forfeited (multiplier included), not the coin's tier. */
/* The old curve was h*mult*(wheelie?2:1), which paid 4x for a tier-2 coin taken
   on a wheelie against 3x for a tier-3 taken clean — a 33% RAISE for taking the
   easier line, on top of the wheelie already being safer to reach. Tiers are now
   2/4/8 and the wheelie bonus is 1.5x, so tier 3 (8) still beats tier 2 on a
   wheelie (6) while the wheelie itself remains worth taking (6 > 4). */
var TIER=[0,2,4,8];
function coinVal(h){return TIER[h]*G.mult*(WHEEL>0.35?1.5:1);}
function aiMiss(sx,cy,h){
  var lost=coinVal(h);
  G.missed++;G.mRun++;G.mLost+=lost;G.mRunV+=lost;
  if(G.streak>0)breakStreak();
  AU.miss();
  spark(G.x+sx,cy,0,-26,0.85,P.gy,'-'+lost,1);
}

/* ── draw ── */
/* VIEWX/DY are the INTERPOLATED draw position; G.x/G.y remain the authoritative
   simulation position. Nothing in step() may read these. */
var VIEWX=0,DY=0,ALPHA=1,CAMX=0;
/* ══ PRE-SCALED BITMAPS ══
   The three parallax bands and the bike were resampled inside drawImage on every
   single frame, at non-integer ratios, with smoothing OFF — a 620px-wide JPEG
   crushed to 381px by nearest-neighbour, 9-12 times a frame, dropping 38% of the
   source columns in an irregular pattern. These are photographs, not pixel art,
   so that is harsh aliasing on every vertical edge, paid for continuously. The
   bike was worse: 344x163 down to 103x49 (one source pixel in 11 survives)
   through a rotate() that was NEVER zero, because the grounded idle tilt is a
   sub-pixel sine. Most expensive draw in the frame and the worst-looking one.
   Scaled once per stage, filtered, then blitted 1:1. */
var BAND=[];
function smoothCtx(c){var t=c.getContext('2d');
  t.imageSmoothingEnabled=true;try{t.imageSmoothingQuality='high';}catch(e){}return t;}
/* Sample a baked band's own top row, for the gutter a jump or a shake opens
   above it. It used to be a hardcoded '#59b6e8' — saturated cyan — so on
   stage 3, whose sky fades white-to-mauve, every jump slammed a ~22px band of
   bright blue across the top of the screen (CAM.y reaches -26 at a charged
   apex). */
function topOf(c,w){
  try{var pd=c.getContext('2d').getImageData(Math.floor(w/2),0,1,1).data;
    return 'rgb('+pd[0]+','+pd[1]+','+pd[2]+')';}catch(e){return '#59b6e8';}
}
/* ══════════════════════════════════════════════════════════════════════════
   BACKGROUNDS — ONE MODULE PER STAGE, DELIBERATELY NOT SHARED
   ══════════════════════════════════════════════════════════════════════════
   These three functions do very similar things and that duplication is the
   point. A single shared builder driven by per-stage tables is what this code
   was, and it could not serve three photographs that want different framing:
   stage 1's sky is 403px wide and its land source the shortest, stage 2 must
   keep a mountain ridge, stage 3 a standing rider. Every attempt to serve all
   three from one set of numbers traded one stage off against another.
   So each stage owns its framing outright. Edit BG1 and nothing that stage 1
   or 3 does can change. The numbers in each are derived from measurements of
   that stage's own art and are written out rather than looked up.

   THE CONTRACT every module must satisfy — the test suite runs all three and
   checks each one, which is what keeps them from drifting apart:
     1. Return an array of layer descriptors, or null if the art has not
        decoded yet (never a partial build — that bakes a torn backdrop).
     2. Every layer scrolls at BG_RATE. Sky and land are baked into ONE image,
        so there is no second rate to get wrong.
     3. The backdrop reaches BD_H, or a gutter opens above the road.
     4. mir is false. The backdrop contains the "GOA 320 km" sign (flips to
        "GOƆ") and chevron boards whose arrows point one way. Mirroring is
        also simply unnecessary: all six source images were measured to tile
        seamlessly — their wrap column differs from its neighbour by about as
        much as any two adjacent columns.
     5. Layers bake at R pixels per logical unit; w and h stay LOGICAL.
   ══════════════════════════════════════════════════════════════════════════ */

/* Reassemble a stage's land photograph from its two halves at NATIVE
   resolution, before anything is scaled. `mid` and `near` are the top and
   bottom of one image overlapping by `ov` rows — near's first `ov` rows are
   the same pixels as mid's last `ov`, so they are skipped rather than drawn
   twice. This is plumbing, not policy: every stage needs the identical
   operation and the overlap is passed in. */
function joinLand(mid,nr,ov){
  var rows=mid.height+nr.height-ov;
  var c=document.createElement('canvas');c.width=mid.width;c.height=rows;
  var t=c.getContext('2d');
  t.drawImage(mid,0,0);
  t.drawImage(nr,0,ov,nr.width,nr.height-ov,0,mid.height,nr.width,nr.height-ov);
  return c;
}
/* Erase a vertical alpha ramp out of a land canvas's top rows so the sky baked
   behind it shows through and the join reads as haze instead of a ruler-
   straight edge. Alpha rather than a blend toward one sampled colour on
   purpose: the sky varies a lot horizontally (stage 3's sun reflection) and a
   single average would be a flat bar across it. */
function hazeIn(t,wpx,hpx){
  t.globalCompositeOperation='destination-out';
  var gr=t.createLinearGradient(0,0,0,hpx);
  gr.addColorStop(0,'rgba(0,0,0,1)');   /* top row: erased, pure sky */
  gr.addColorStop(1,'rgba(0,0,0,0)');   /* hpx down: fully land */
  t.fillStyle=gr;t.fillRect(0,0,wpx,hpx);
  t.globalCompositeOperation='source-over';
}
/* Clone a clean strip of an image over an unwanted object in it, feathering
   the patch's OWN alpha at its edges so it dissolves into the untouched pixels
   instead of butting against them. `shift` is how far away the clean source
   sits (negative = to the left). Works in SOURCE pixels and returns a new
   canvas, so the result is independent of RS and of any later change to tile
   width, and the decoded image is never modified.
   Plumbing. Which stage uses it, and on what, is that stage's business. */
function patchOut(src,x,w,h,shift,fx,fb,flip){
  var c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  var t=c.getContext('2d');t.drawImage(src,0,0);
  var p=document.createElement('canvas');p.width=w;p.height=h;
  var pt=p.getContext('2d');
  /* `flip` mirror-pads instead of copying. Worth it when the clone would cross
     a strong lighting gradient: a straight copy from 57px toward a sunset's
     reflection column lands visibly brighter than what it replaces, and reads
     as a pale rectangle. Mirroring about the patch edge makes the seam an
     exact match by construction and continues the gradient instead of
     stepping it. */
  if(flip){pt.save();pt.translate(w,0);pt.scale(-1,1);
    pt.drawImage(src,x+shift,0,w,h,0,0,w,h);pt.restore();}

     tint hit a different subset again. They belong here, right after the world.
     The assist dim is also faded rather than popped: it is the most consequential
     state change in the game and it had no transition at all. */
  if(G.aiFade>0.01){g.fillStyle='rgba(13,11,31,'+(0.35*G.aiFade).toFixed(3)+')';g.fillRect(0,0,VW,VH);}
  /* Flash alpha squared: linear decay read as a slab. Same peak, tail 222->110ms. */
  if(G.flash>0){g.fillStyle='rgba(226,69,74,'+(G.flash*G.flash*(RM?0.40:0.78)).toFixed(3)+')';
    g.fillRect(0,0,VW,VH);}

  if(G.mode==='attract'){
    /* The .25 dim here stacked on #screen's own rgba(13,11,31,.74) and the
       assist dim, leaving the world at ~13% visibility on the one screen whose
       job is to sell the game. #screen alone is plenty. */
    return;
  }
  /* ══ HUD: the clock is the fail state, so it leads ══ */
  var low=G.clock<8,cw=Math.max(0,G.clock);
  panel(g,6,6,74,16,low?P.rd:P.cy);
  var cs=cw.toFixed(1)+'S';
  if(!low||blink(1.5))txt(g,cs,10,11,low?P.rd:P.wh,P.n0);
  g.fillStyle=P.n1;g.fillRect(10,18,66,2);
  g.fillStyle=low?P.rd:P.cy;g.fillRect(10,18,Math.round(66*Math.min(1,cw/Math.max(1,ST[G.st].time))),2);

  /* AI fuel — labelled, because it no longer behaves like health */
  panel(g,6,25,74,12,P.p1);
  txt(g,'AI',9,28,P.cy);
  for(var i=0;i<7;i++){g.fillStyle=(G.bat/14.3)>i?P.cy:P.n1;g.fillRect(19+i*8,28,6,6);}

  /* streak pips, flashed red the moment the run of coins breaks */
  /* was 9 flashes/sec — on its own over the WCAG 2.3.1 limit, and it ran
     concurrently with three other blinkers */
  var pf=G.pipT>0&&blink(1.5);
  panel(g,6,40,58,12,pf?P.rd:P.am);
  txt(g,'x'+G.mult,10,43,pf?P.rd:P.sa);
  for(var i=0;i<5;i++){g.fillStyle=i<G.mult?(pf?P.rd:P.am):P.p0;g.fillRect(24+i*7,43,5,6);}

  panel(g,6,55,44,12,P.am);
  g.drawImage(coinF[0],9,56);
  txt(g,''+pad(G.coins),22,58,P.wh);

  panel(g,VW-104,6,98,12,P.p1);
  txt(g,ST[G.st].tag,VW-100,9,P.sa);
  txt(g,ST[G.st].name,VW-10-tw(ST[G.st].name),9,P.wh);
  panel(g,VW-104,21,98,10,P.cy);
  g.fillStyle=P.n1;g.fillRect(VW-101,23,92,6);
  var pr=Math.min(1,G.x/Math.max(1,G.endX||STLEN[G.st]));
  g.fillStyle=P.cy;g.fillRect(VW-101,23,Math.round(92*pr),6);
  g.fillStyle=P.am;g.fillRect(VW-101+Math.round(92*pr)-1,22,3,8);

  /* ══ BOTTOM-CENTRE STACK, DE-COLLIDED ══
     AI RIDING (rows 244-258) overlapped the WHEELIE panel (250-262), and the
     'X1.5 NO TIER 3' warning at row 238 sat entirely inside the CHARGE panel
     (234-246) which is drawn right after it — so for ~1s after every
     brake-charge the wheelie warning was painted over completely.
     Lanes now: warning 206 | AI RIDING 218-232 | CHARGE 234-246 | WHEELIE 250-262. */
  if(G.assist){          /* the dim itself now lives with the world block above */
    panel(g,VW/2-34,VH-52,68,14,P.am);
    txt(g,'AI RIDING',VW/2-30,VH-48,P.sa);
  }
  /* Moved up out of ZONE.ai [424,230,50,34], which fully CONTAINED this meter —
     so on touch the AI button repainted over it and the player lost the only
     live readout of the metric the end-of-stage rank is computed from. */
  panel(g,VW-40,VH-74,32,28,G.assist?P.am:P.cy);
  g.fillStyle=P.n1;g.fillRect(VW-36,VH-70,24,20);
  var af=Math.min(1,G.aTime/Math.max(1,G.t));
  g.fillStyle=af>0.3?P.rd:P.cy;g.fillRect(VW-36,VH-50-Math.round(20*af),24,Math.round(20*af));
  txt(g,'AI',VW-30,VH-63,P.wh,P.n0);

  if(G.toastT>0)txt(g,G.toast,Math.round(VW/2-tw(G.toast)/2),58,P.sa,P.n0);
  /* icon geometry derived from the zone rather than hardcoded, so moving the
     zone for touch-target sizing cannot desync the glyph from its button */
  var mz=ZONE.mute,mx=mz[0]+6,my=mz[1]+((mz[3]-10)>>1);
  panel(g,mz[0],mz[1],mz[2],mz[3],AU.isOn()?P.cy:P.p0);
  g.fillStyle=AU.isOn()?P.cy:P.p0;g.fillRect(mx,my+2,3,6);g.fillRect(mx+3,my,3,10);
  if(!AU.isOn()){g.fillStyle=P.rd;g.fillRect(mx+8,my+1,9,1);g.fillRect(mx+8,my+8,9,1);}
  else{g.fillStyle=P.cy;g.fillRect(mx+9,my+2,1,6);g.fillRect(mx+12,my,1,10);}
  if(G.touchUI){
    var t=touchState();
    g.globalAlpha=.72;
    tbtn(g,ZONE.bk,'BRAKE',P.cy,t.b);
    tbtn(g,ZONE.thr,'GAS',P.am,t.t);
    tbtn(g,ZONE.ai,'AI',G.assist?P.am:P.cy,t.a);
    g.globalAlpha=1;
  }
  /* charge + wheelie readouts, only while relevant */
  if(WHEEL>0.05){
    panel(g,VW/2-38,VH-20,76,12,P.am);
    txt(g,'WHEELIE',VW/2-34,VH-17,P.sa);
    g.fillStyle=P.n1;g.fillRect(VW/2-1,VH-17,36,6);
    g.fillStyle=WHEEL>0.35?P.sa:P.p1;g.fillRect(VW/2-1,VH-17,Math.round(36*WHEEL),6);
    if(WHEEL>0.35)txt(g,'X1.5 NO TIER 3',VW/2-28,VH-64,P.sa,P.n0);
  }
  if(G.charge>0.02){
    /* Must match the boost gate in step() exactly. The gate moved 0.25 -> 0.45
       precisely because the HUD said READY and the player hit the wall anyway —
       and then only the gameplay half of that fix was applied, so the meter went
       on lying for the same 0.20 of charge. One constant, two readers. */
    var full=G.charge>0.45;
    panel(g,VW/2-38,VH-36,76,12,full?P.cy:P.p1);
    txt(g,'CHARGE',VW/2-34,VH-33,full?P.cy:P.p0);
    g.fillStyle=P.n1;g.fillRect(VW/2-4,VH-33,38,6);
    g.fillStyle=full?P.cy:P.p1;g.fillRect(VW/2-4,VH-33,Math.round(38*G.charge),6);
  }
}

/* ── loop ── */
var STEP=1/120,acc=0,last=performance.now();
function loop(now){
  var dt=(now-last)/1000;last=now;
  if(dt>0.2)dt=0.2;
  try{
    sample();                                  /* once per frame, before it is consumed */
    G.rt+=dt;                        /* wall clock — never gated by hitstop */
    if(G.hitstop>0){
      G.hitstop-=dt;acc=0;ALPHA=1;
      /* step() is skipped, which froze EVERYTHING visual: shake decay, flash
         decay and particle motion all live inside step(). For 110ms after a
         crash the screen held one constant shake offset with frozen debris and a
         frozen tint — a lurch, not a shake. A shaking camera over a frozen world
         is the entire point of hitstop; a frozen camera is a hung frame.
         Decay at 35% and crawl the debris at 15%: that reads as time dilation
         rather than a crashed process. */
      visualDecay(dt,0.30);
    }
    else{acc+=dt;var gd=0;while(acc>=STEP&&gd++<24){step(STEP);acc-=STEP;}
      var simOn=(G.mode==='play'||G.mode==='attract')&&!G.pause;
      /* The leftover accumulator IS the blend factor — but only while the sim is
         actually advancing. Frozen on a card, G.px and G.x stay one substep
         apart while acc keeps oscillating, so CAMX toggled across an integer
         boundary and the whole scene crawled 1px (3-4 device px upscaled) behind
         a dead screen. */
      ALPHA=simOn?Math.min(1,acc/STEP):1;
      /* step() returns early for 'fail', 'done' and paused, so nothing drained
         shake, flash, toasts or particles there — dying with residual trauma
         left the RUN OVER card jittering under a permanent red tint with crash
         debris frozen mid-air, forever. */
      if(!simOn)visualDecay(dt,1);}
    camera(dt);                      /* render-only; must run after ALPHA is set */
    /* engine audio: 6 param automations per call, so once per frame not per substep.
       Also silences properly while paused, which it did not before. */
    var act=(G.mode==='play'||G.mode==='attract')&&!G.pause;
    AU.engine(G.spd,IN.th?1:(IN.bk?.15:.45),act);
    draw();
    /* Post pass. Driven entirely by state the simulation already owns — no new
       parameters, nothing for step() to maintain. */
    FX.frame(cv,G.shake,G.flash,G.aiFade);
  }catch(err){
    /* was: warn once, then silently swallow every later error forever, so a
       recurring fault was invisible after its first occurrence. */
    loop.errs=(loop.errs||0)+1;
    if(loop.errs<=3&&typeof console!=='undefined'&&console.error)
      console.error('frame error #'+loop.errs,err);
  }
  requestAnimationFrame(loop);
}
if(typeof global!=='undefined'){global.__fail=fail;global.__rescue=rescue;global.__done=done;}
/* Debug/QA surface. Everything a headless browser or a future Playwright suite
   needs to drive a scenario without reaching through the DOM — which is exactly
   what both the rendering and QA reviews asked for. Read-only by convention;
   nothing in the game reads it back. */
if(typeof window!=='undefined')window.__NM={G:G,FX:FX,start:start,step:step,
  draw:draw,fail:fail,rescue:rescue,done:done,pause:pause,toMenu:toMenu,
  OBSB:OBSB,SEG:SEG,ORDER:ORDER,STLEN:STLEN,
  BIKE_BODY:function(){return BIKE_BODY;},BIKE_WHEEL:function(){return BIKE_WHEEL;},
  GROUND:GROUND,BFOOT:BFOOT,WHY:WHY,WHEEL_R:WHEEL_R};
/* rAF is fully PAUSED in background tabs, not throttled, so the first timestamp
   after returning can be arbitrarily stale. Reset the clock instead of leaning
   on the 0.2s dt clamp to absorb it. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if(G.mode==='play'&&!G.pause)pause(); }
  else { last=performance.now(); acc=0;
    /* Browsers suspend the AudioContext on tab hide and nothing here resumed
       it, so returning to the tab and clicking RESUME left the whole run
       silent. It self-healed on the next keypress for keyboard players and
       never for gamepad-only ones, since pad state is polled and a pad press is
       not a user-activation gesture. */
    AU.unlock(); }
});

/* ══ INTEGER UPSCALE ══
   #gl was width:100%/height:100%, so the backbuffer was upscaled by whatever
   ratio the viewport happened to give — 2.7x, 3.4x, whatever. `pixelated` at a
   fractional factor renders some source pixels 3 device px wide and others 4, so
   every vertical edge in the art and every glyph of the 3x5 font came out
   unevenly thick. All the integer-snapping upstream was being thrown away at the
   presentation layer. Snap to a whole multiple and letterbox the remainder. */
function fit(){
  try{
    var w=document.getElementById('wrap');
    var s=Math.min(w.clientWidth/VW,w.clientHeight/VH);
    if(!(s>0))return;
    /* This used to snap s to half-steps to keep the CSS upscale integral,
       because at a 480-wide backbuffer a fractional upscale under
       image-rendering:pixelated made some art pixels 3 device px wide and
       others 4 — visible banding on every vertical edge.
       RS now carries that job: the backbuffer matches the display's density,
       so an art pixel is RS backbuffer pixels and the residual unevenness is
       ±1 device px on an RS-sized unit instead of on a 1-sized one. Snapping
       is no longer worth what it cost — on a 1600x900 window it threw away
       24% of the area (1200x675 presented in 1582x714), which is the opposite
       of filling the screen. s is continuous now and the picture fills the
       viewport on whichever axis binds first. */
    var dpr=Math.max(1,Math.min(typeof devicePixelRatio!=='undefined'?devicePixelRatio:1,2));
    /* s*dpr is how many device pixels one logical unit is presented at, so it
       is the density the backbuffer wants to match.
       FLOOR, not round. The backbuffer must never be LARGER than the rect it
       is presented in: #gl is image-rendering:pixelated and the FX pass samples
       NEAREST, and nearest-downscaling drops whole columns, which both loses
       the detail the density was for and shimmers as the scene scrolls.
       Rounding did exactly that at s=2.5 (backbuffer 1440 into a 1200px rect).
       Overshooting upward is the safe direction: a 1.25x nearest upscale just
       makes some pixels a device pixel wider.
       Rebake only on an actual change — a drag-resize fires continuously and
       buildBands is not free. */
    var want=Math.max(1,Math.min(RS_MAX,Math.floor(s*dpr)));
    if(want!==RS){RS=want;applyRS();}
    cv.style.width=Math.round(VW*s)+'px';
    cv.style.height=Math.round(VH*s)+'px';
    /* the post pass matches #gl's rect exactly and sits on top of it */
    FX.size(VW*s,VH*s,dpr);
  }catch(e){}
}
addEventListener('resize',fit);
/* Entering or leaving fullscreen resizes #wrap without always firing resize on
   every engine, and the orientation change on mobile lands a frame late. */
['fullscreenchange','webkitfullscreenchange','orientationchange'].forEach(function(n){
  try{addEventListener(n,function(){fit();setTimeout(fit,120);});}catch(e){}
});
/* ══ FULLSCREEN ══
   Requesting it on #wrap rather than documentElement keeps the game the
   fullscreen element, so the CSS below can drop the letterbox and fit() sees
   the real viewport. Must be called from inside a user gesture or the promise
   rejects — hence key/button handlers only, never on load. */
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFull(){
  try{
    var w=document.getElementById('wrap');
    if(isFull()){
      var x=document.exitFullscreen||document.webkitExitFullscreen;
      if(x)x.call(document);
    }else{
      var r=w.requestFullscreen||w.webkitRequestFullscreen;
      /* older WebKit returns undefined rather than a promise */
      if(r){var p=r.call(w);if(p&&p['catch'])p['catch'](function(){});}
    }
    try{w.focus();}catch(e2){}
  }catch(e){}
}
})();
</script>
